[project]
name = "quotation-to-excel-backend"
version = "0.1.0"
description = "FastAPI backend for the Quotation-to-Excel Automation System"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
